name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Firebase Auth Configuration
          NEXT_PUBLIC_AUTH_API_KEY: ${{ secrets.NEXT_PUBLIC_AUTH_API_KEY }}
          NEXT_PUBLIC_AUTH_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH_AUTH_DOMAIN }}
          NEXT_PUBLIC_AUTH_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_AUTH_PROJECT_ID }}
          NEXT_PUBLIC_AUTH_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_AUTH_STORAGE_BUCKET }}
          NEXT_PUBLIC_AUTH_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_AUTH_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_AUTH_APP_ID: ${{ secrets.NEXT_PUBLIC_AUTH_APP_ID }}
          # FootieTeamz26 Database Configuration
          NEXT_PUBLIC_DB_API_KEY: ${{ secrets.NEXT_PUBLIC_DB_API_KEY }}
          NEXT_PUBLIC_DB_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_DB_AUTH_DOMAIN }}
          NEXT_PUBLIC_DB_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_DB_PROJECT_ID }}
          NEXT_PUBLIC_DB_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_DB_STORAGE_BUCKET }}
          NEXT_PUBLIC_DB_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_DB_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_DB_APP_ID: ${{ secrets.NEXT_PUBLIC_DB_APP_ID }}

      - name: Deploy to Firebase (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: footieteamz26
          channelId: live
          target: production
